services:
  - type: web
    name: mushuk-galereyasi
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: VITE_TG_APP_LINK
        sync: false
      - key: BOT_WEBHOOK_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # Neon Object Storage on the production branch; the bucket is public, so these are not secrets.
      - key: MEDIA_BASE_URL
        value: https://br-noisy-mouse-bafcubif.storage.c-8.eu-central-1.aws.neon.tech/gallery
      - key: S3_ENDPOINT
        value: https://br-noisy-mouse-bafcubif.storage.c-8.eu-central-1.aws.neon.tech
      - key: S3_BUCKET
        value: gallery
      - key: S3_REGION
        value: eu-central-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
